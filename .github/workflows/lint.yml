name: Lint

on:
  push:
    branches: ['codex/ghav-maplibre353-complete-*']

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - windows-2022
          - ubuntu-22.04
        node_version:
          - 14
        architecture:
          - x64

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: ${{ matrix.architecture }}
      - run: npm ci
      - run: npm run lint
      - run: npm run lint-docs
      - run: npm run lint-css
