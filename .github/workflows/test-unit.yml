name: Test Unit

on:
  push:
    branches: ['codex/ghav-maplibre353-complete-*']

jobs:
  test_unit_win_mac:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - windows-2022
        node_version:
          - 14
        architecture:
          - x64

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: ${{ matrix.architecture }}
      - run: npm ci
      - run: npm run build-dev
      - run: npm run test-unit

  test_unit_ubuntu:
    name: ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js 14 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: x64
      - run: npm ci
      - run: npm run build-dev
      # see: https://github.com/stackgl/headless-gl#how-can-headless-gl-be-used-on-a-headless-linux-machine
      - run: xvfb-run -s "-ac -screen 0 1280x1024x24" npm run test-unit
