# This workflow will install node dependencies, build the source code and run the tests

name: CI

on:
  push:
    branches: ['codex/ghav-maplibre353-complete-*']

jobs:
  lint_build_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - windows-2022
        node_version:
          - 14
        architecture:
          - x64

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: ${{ matrix.architecture }}
      - run: npm ci

      - run: npm run lint
      - run: npm run build-dev
      - run: npm run test-unit

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js 14 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: x64
      - run: npm ci
      - run: npm run lint
      - run: npm run lint-docs
      - run: npm run lint-css

  test-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js 14 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: x64
      - run: npm ci
      - run: npm run build-dev
      # see: https://github.com/stackgl/headless-gl#how-can-headless-gl-be-used-on-a-headless-linux-machine
      - run: xvfb-run -s "-ac -screen 0 1280x1024x24" npm run test-unit

  test-query:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js 14 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: x64
      - run: npm ci
      - run: npm run build-dev
      - run: npm run test-query
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ./test/integration/query-tests
          name: querytests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ./test/integration/query-tests/index.html
          name: querytests.html

  test-expressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js 14 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: x64
      - run: npm ci
      - run: npm run build-dev
      - run: npm run test-expressions

  test-browser:
    timeout-minutes: 30
    # These are a bit flaky and occasionally time out
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js 14 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: x64
      - run: npm ci
      - run: npm run build-dev
      - name: Use hosted matching ChromeDriver
        run: |
          test -x "$CHROMEWEBDRIVER/chromedriver"
          "$CHROMEWEBDRIVER/chromedriver" --version
          google-chrome --version
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
      - name: Use hosted matching GeckoDriver
        run: |
          test -x "$GECKOWEBDRIVER/geckodriver"
          "$GECKOWEBDRIVER/geckodriver" --version
          firefox --version
          echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH
      - name: Test Chrome
        env:
          SELENIUM_BROWSER: chrome
          TAP_COLORS: 1
        run: xvfb-run -s "-ac -screen 0 1280x1024x24" npm run test-browser
      - name: Test Firefox
        env:
          SELENIUM_BROWSER: firefox
          TAP_COLORS: 1
        run: xvfb-run -s "-ac -screen 0 1280x1024x24" npm run test-browser
