name: Test Browser

on:
  push:
    branches: ['codex/ghav-maplibre353-complete-*']

jobs:
  test_browser:
    name: ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d861b637a1e9cee504f4085affa990d89389c59c
      - name: Use Node.js 14 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 14.21.3
          architecture: x64
      - run: npm ci
      - run: npm run build-dev
      - name: Use hosted matching ChromeDriver
        run: |
          test -x "$CHROMEWEBDRIVER/chromedriver"
          "$CHROMEWEBDRIVER/chromedriver" --version
          google-chrome --version
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
      - name: Use hosted matching GeckoDriver
        run: |
          test -x "$GECKOWEBDRIVER/geckodriver"
          "$GECKOWEBDRIVER/geckodriver" --version
          firefox --version
          echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH"
      - name: Test Chrome
        env:
          SELENIUM_BROWSER: chrome
          TAP_COLORS: 1
        run: xvfb-run -s "-ac -screen 0 1280x1024x24" npm run test-browser
      - name: Test Firefox
        env:
          SELENIUM_BROWSER: firefox
          TAP_COLORS: 1
        run: xvfb-run -s "-ac -screen 0 1280x1024x24" npm run test-browser
